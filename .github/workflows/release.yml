name: Build & Release Searcher Browser (Desktop & Mobile)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SearcherBrowser-Windows.zip
            asset_name: SearcherBrowser-Windows.zip
          - os: macos-latest
            artifact_name: SearcherBrowser-macOS.zip
            asset_name: SearcherBrowser-macOS.zip
          - os: ubuntu-latest
            artifact_name: SearcherBrowser-Linux.zip
            asset_name: SearcherBrowser-Linux.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Application Icon
        run: |
          python -c "from PIL import Image; img = Image.open('assets/logo.png'); img.save('assets/logo.ico', format='ICO')"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller SearcherBrowser.spec

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/SearcherBrowser/* -DestinationPath dist/SearcherBrowser-Windows.zip

      - name: Package Binary (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist && zip -r ${{ matrix.asset_name }} SearcherBrowser/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}

  build-mobile:
    name: Package Searcher Mobile Browser (PWA / Android App Package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Mobile App Zip Package
        run: |
          mkdir -p dist_mobile/SearcherBrowser-Mobile
          cp -r assets assets/manifest.json assets/sw.js mobile/ dist_mobile/SearcherBrowser-Mobile/
          cd dist_mobile && zip -r SearcherBrowser-Mobile-PWA.zip SearcherBrowser-Mobile/

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearcherBrowser-Mobile-PWA.zip
          path: dist_mobile/SearcherBrowser-Mobile-PWA.zip

  release:
    name: Publish GitHub Release
    needs: [build, build-mobile]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SearcherBrowser-Windows.zip/SearcherBrowser-Windows.zip
            dist/SearcherBrowser-macOS.zip/SearcherBrowser-macOS.zip
            dist/SearcherBrowser-Linux.zip/SearcherBrowser-Linux.zip
            dist/SearcherBrowser-Mobile-PWA.zip/SearcherBrowser-Mobile-PWA.zip
          name: Searcher Browser Release ${{ github.ref_name }}
          body: |
            🚀 **Searcher Browser Release ${{ github.ref_name }}**
            
            ### Available Downloads:
            - 🪟 **Windows**: `SearcherBrowser-Windows.zip`
            - 🍎 **macOS**: `SearcherBrowser-macOS.zip`
            - 🐧 **Linux**: `SearcherBrowser-Linux.zip`
            - 📱 **Mobile Phone (Android / iOS / PWA)**: `SearcherBrowser-Mobile-PWA.zip`
            
            ### Features included in this release:
            - 📱 **Mobile Phone Web Browser & Standalone PWA Support** (Install directly on Android / iPhone)
            - 🌐 **Automatic Offline Mode & Cache Serving** (`searcher-cache://`)
            - 🤖 **Searcher AI Assistant** integrated into Start Page & Mobile Navigation
            - 🔍 **Custom Multi-Source Searcher Engine** (Wikipedia + DuckDuckGo + Open Web)
            - 🎨 **Modern Responsive Mobile/Desktop Design System** with hand-crafted vector icons
            - 🔖 **Interactive Modals & Custom Shortcuts** (Bookmarks, History, Downloads, Settings)
